# Fork branding overlay — applied after every upstream sync.
# These values re-stamp identity fields that upstream may overwrite on merge.
# Do NOT put secrets here; only public branding identifiers.

# Upstream project
UPSTREAM_GITHUB_OWNER=Wei-Shaw
UPSTREAM_GITHUB_REPO=sub2api
UPSTREAM_DOCKERHUB_USER=weishaw

# This fork
FORK_GITHUB_OWNER=SakurajimMai
FORK_GITHUB_REPO=sub2api
FORK_DOCKERHUB_USER=sakurajiamai

# Paths (relative to repo root) where branding replacements are applied.
# Directories are walked recursively with safe excludes (see apply-overlay.sh).
OVERLAY_PATHS="
Dockerfile
Dockerfile.goreleaser
README.md
README_CN.md
README_JA.md
deploy
frontend/src/components/common/VersionBadge.vue
backend/internal/service/update_service.go
"

# Keep upstream star-history badges (metrics belong to the original project).
RESTORE_UPSTREAM_STAR_HISTORY=true
