name: Sync Upstream

# Merges Wei-Shaw/sub2api into this fork's main, then re-applies fork branding.
# Clean merges push straight to main (no PR required — GITHUB_TOKEN often cannot
# create PRs when workflow permissions are restricted).
# Non-workflow conflicts are reported in the job summary for manual resolution.

on:
  schedule:
    # Daily 03:15 UTC
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check whether upstream is ahead (no merge/push)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Shared with Mirror Upstream Release so both never mutate main concurrently
  group: fork-main-mutation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          # Only need main for delta/merge. Do not fetch tags: local tags from a
          # prior checkout/mirror can differ from upstream and "would clobber"
          # causes fetch to exit 1 (seen with v0.1.163–v0.1.169).
          git fetch upstream main --no-tags
          git fetch origin main --no-tags

      - name: Detect upstream delta
        id: delta
        run: |
          BASE_BRANCH="main"
          git checkout "$BASE_BRANCH"
          git reset --hard "origin/${BASE_BRANCH}"

          BEHIND="$(git rev-list --count HEAD..upstream/main)"
          AHEAD="$(git rev-list --count upstream/main..HEAD)"
          UPSTREAM_SHA="$(git rev-parse --short upstream/main)"
          LOCAL_SHA="$(git rev-parse --short HEAD)"

          {
            echo "behind=${BEHIND}"
            echo "ahead=${AHEAD}"
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "local_sha=${LOCAL_SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "Fork ${LOCAL_SHA} | upstream ${UPSTREAM_SHA} | behind=${BEHIND} ahead=${AHEAD}"

          if [[ "$BEHIND" -eq 0 ]]; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already up to date
        if: steps.delta.outputs.already_up_to_date == 'true'
        run: echo "Already up to date with upstream/main — nothing to do."

      - name: Dry run summary
        if: >
          steps.delta.outputs.already_up_to_date == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.dry_run == true
        run: |
          echo "Upstream is ahead by ${{ steps.delta.outputs.behind }} commit(s)."
          git log --oneline HEAD..upstream/main | head -50

      - name: Merge upstream into main and apply overlay
        id: merge
        if: >
          steps.delta.outputs.already_up_to_date == 'false' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        run: |
          set -euo pipefail
          UPSTREAM_SHA="${{ steps.delta.outputs.upstream_sha }}"
          BEHIND="${{ steps.delta.outputs.behind }}"

          git checkout main
          git reset --hard origin/main

          chmod +x .fork/merge-upstream-preserving-workflows.sh \
            .fork/restore-managed-workflows.sh .fork/apply-overlay.sh

          set +e
          ./.fork/merge-upstream-preserving-workflows.sh \
            origin/main \
            "chore(sync): merge upstream/main @ ${UPSTREAM_SHA}" \
            upstream/main
          merge_status=$?
          set -e

          if [[ $merge_status -eq 0 ]]; then
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
            echo "Merge completed without conflicts (${BEHIND} commit(s))."
          else
            # Auto-resolve the common VERSION-only conflict: always prefer upstream's
            # VERSION when that is the sole conflict (fork mirror rewinds caused this).
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U || true)
            if [[ $merge_status -eq 2 && ${#CONFLICTS[@]} -eq 1 && "${CONFLICTS[0]}" == "backend/cmd/server/VERSION" ]]; then
              echo "Only VERSION conflicts — taking upstream VERSION."
              git checkout --theirs backend/cmd/server/VERSION
              git add backend/cmd/server/VERSION
              git commit --no-edit
              echo "merge_status=clean" >> "$GITHUB_OUTPUT"
              echo "auto_resolved_version=true" >> "$GITHUB_OUTPUT"
            else
              echo "merge_status=conflicts" >> "$GITHUB_OUTPUT"
              echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
              echo "conflict_files=${CONFLICTS[*]:-unknown}" >> "$GITHUB_OUTPUT"
              {
                echo "## Sync blocked by non-workflow conflicts"
                echo
                echo "Upstream: upstream/main @ ${UPSTREAM_SHA}"
                echo
                if [[ ${#CONFLICTS[@]} -gt 0 ]]; then
                  printf -- '- `%s`\n' "${CONFLICTS[@]}"
                else
                  echo '- `unknown`'
                fi
                echo
                echo "Merge upstream/main locally, resolve the files above, push main, then re-run this workflow."
              } >> "$GITHUB_STEP_SUMMARY"
              git merge --abort || true
              exit 0
            fi
          fi

          ./.fork/restore-managed-workflows.sh origin/main
          ./.fork/apply-overlay.sh
          echo "overlay_status=ok" >> "$GITHUB_OUTPUT"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit --amend --no-edit
          else
            echo "Overlay made no additional file changes (already stamped)."
          fi

          git push origin main
          echo "pushed_main=true" >> "$GITHUB_OUTPUT"
          echo "Synced main to upstream/main @ ${UPSTREAM_SHA}"

      - name: Fail job when conflicts need manual work
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          echo "::error::Upstream merge has non-workflow conflicts: ${{ steps.merge.outputs.conflict_files }}"
          echo "See the job summary for local resolution commands."
          exit 1
