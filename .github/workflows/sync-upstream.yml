name: Sync Upstream

# Merges Wei-Shaw/sub2api into this fork's main, then re-applies fork branding.
# .fork/merge-upstream-auto.sh resolves mechanical conflicts (generated code,
# VERSION, go.sum), hands the rest — and semantic breakage — to DeepSeek via
# Claude Code when the DEEPSEEK_API_KEY secret is set, and runs the build/test gate
# before anything is pushed (no PR — GITHUB_TOKEN often cannot create PRs when
# workflow permissions are restricted).
# Unresolvable conflicts or a failed gate fail the job and leave main untouched.

on:
  schedule:
    # Daily 03:15 UTC
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check whether upstream is ahead (no merge/push)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # Shared with Mirror Upstream Release so both never mutate main concurrently
  group: fork-main-mutation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # The verify gate executes upstream code: keep the token off disk and
          # hand it only to the final push step.
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          # Only need main for delta/merge. Do not fetch tags: local tags from a
          # prior checkout/mirror can differ from upstream and "would clobber"
          # causes fetch to exit 1 (seen with v0.1.163–v0.1.169).
          git fetch upstream main --no-tags
          git fetch origin main --no-tags

      - name: Detect upstream delta
        id: delta
        run: |
          BASE_BRANCH="main"
          git checkout "$BASE_BRANCH"
          git reset --hard "origin/${BASE_BRANCH}"

          BEHIND="$(git rev-list --count HEAD..upstream/main)"
          AHEAD="$(git rev-list --count upstream/main..HEAD)"
          UPSTREAM_SHA="$(git rev-parse --short upstream/main)"
          LOCAL_SHA="$(git rev-parse --short HEAD)"

          {
            echo "behind=${BEHIND}"
            echo "ahead=${AHEAD}"
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "local_sha=${LOCAL_SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "Fork ${LOCAL_SHA} | upstream ${UPSTREAM_SHA} | behind=${BEHIND} ahead=${AHEAD}"

          if [[ "$BEHIND" -eq 0 ]]; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already up to date
        if: steps.delta.outputs.already_up_to_date == 'true'
        run: echo "Already up to date with upstream/main — nothing to do."

      - name: Dry run summary
        if: >
          steps.delta.outputs.already_up_to_date == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.dry_run == true
        run: |
          echo "Upstream is ahead by ${{ steps.delta.outputs.behind }} commit(s)."
          git log --oneline HEAD..upstream/main | head -50

      - name: Set up Go
        if: >
          steps.delta.outputs.already_up_to_date == 'false' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup pnpm
        if: >
          steps.delta.outputs.already_up_to_date == 'false' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        if: >
          steps.delta.outputs.already_up_to_date == 'false' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Merge upstream into main, verify and apply overlay
        id: merge
        if: >
          steps.delta.outputs.already_up_to_date == 'false' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        env:
          # Only this step sees the key; merge-upstream-auto.sh hands it to the AI
          # process alone (never to the verify gate, which executes upstream code).
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_MERGE_MODEL: ${{ vars.AI_MERGE_MODEL || 'deepseek-v4-pro' }}
        run: |
          set -euo pipefail
          UPSTREAM_SHA="${{ steps.delta.outputs.upstream_sha }}"

          git checkout main
          git reset --hard origin/main
          chmod +x .fork/*.sh

          set +e
          ./.fork/merge-upstream-auto.sh \
            origin/main \
            "chore(sync): merge upstream/main @ ${UPSTREAM_SHA}" \
            upstream/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            echo "::error::Automatic upstream merge stopped (exit ${merge_status}); main was not changed. See the job summary."
            exit "$merge_status"
          fi

          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
            echo "Nothing new to push."
            exit 0
          fi

          ./.fork/restore-managed-workflows.sh origin/main
          ./.fork/apply-overlay.sh
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit --amend --no-edit
          else
            echo "Overlay made no additional file changes (already stamped)."
          fi
          echo "push=true" >> "$GITHUB_OUTPUT"

      - name: Push main
        if: steps.merge.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "Synced main to upstream/main @ ${{ steps.delta.outputs.upstream_sha }}"

      - name: Keep only the latest 10 workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_COUNT: "10"
        run: |
          chmod +x .fork/cleanup-workflow-runs.sh
          ./.fork/cleanup-workflow-runs.sh
