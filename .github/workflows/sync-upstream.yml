name: Sync Upstream

# Merges Wei-Shaw/sub2api into this fork's main, then re-applies fork branding.
# Clean merges push straight to main (no PR required — GITHUB_TOKEN often cannot
# create PRs when workflow permissions are restricted).
# Conflicts open a branch for manual resolution.

on:
  schedule:
    # Daily 03:15 UTC
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check whether upstream is ahead (no merge/push)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Shared with Mirror Upstream Release so both never mutate main concurrently
  group: fork-main-mutation
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          # Only need main for delta/merge. Do not fetch tags: local tags from a
          # prior checkout/mirror can differ from upstream and "would clobber"
          # causes fetch to exit 1 (seen with v0.1.163–v0.1.169).
          git fetch upstream main --no-tags
          git fetch origin main --no-tags

      - name: Detect upstream delta
        id: delta
        run: |
          BASE_BRANCH="main"
          git checkout "$BASE_BRANCH"
          git reset --hard "origin/${BASE_BRANCH}"

          BEHIND="$(git rev-list --count HEAD..upstream/main)"
          AHEAD="$(git rev-list --count upstream/main..HEAD)"
          UPSTREAM_SHA="$(git rev-parse --short upstream/main)"
          LOCAL_SHA="$(git rev-parse --short HEAD)"

          {
            echo "behind=${BEHIND}"
            echo "ahead=${AHEAD}"
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "local_sha=${LOCAL_SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "Fork ${LOCAL_SHA} | upstream ${UPSTREAM_SHA} | behind=${BEHIND} ahead=${AHEAD}"

          if [[ "$BEHIND" -eq 0 ]]; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already up to date
        if: steps.delta.outputs.already_up_to_date == 'true'
        run: echo "Already up to date with upstream/main — nothing to do."

      - name: Dry run summary
        if: >
          steps.delta.outputs.already_up_to_date == 'false' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.dry_run == true
        run: |
          echo "Upstream is ahead by ${{ steps.delta.outputs.behind }} commit(s)."
          git log --oneline HEAD..upstream/main | head -50

      - name: Merge upstream into main and apply overlay
        id: merge
        if: >
          steps.delta.outputs.already_up_to_date == 'false' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
        run: |
          set -euo pipefail
          UPSTREAM_SHA="${{ steps.delta.outputs.upstream_sha }}"
          BEHIND="${{ steps.delta.outputs.behind }}"

          git checkout main
          git reset --hard origin/main

          if git merge --no-edit -m "chore(sync): merge upstream/main @ ${UPSTREAM_SHA}" upstream/main; then
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
            echo "Merge completed without conflicts (${BEHIND} commit(s))."
          else
            echo "merge_status=conflicts" >> "$GITHUB_OUTPUT"
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            echo "Merge conflicts — aborting and pushing a conflict marker branch."
            git merge --abort || true

            BRANCH="sync/upstream-${UPSTREAM_SHA}-conflicts"
            git checkout -B "$BRANCH" origin/main
            git commit --allow-empty -m "chore(sync): upstream @ ${UPSTREAM_SHA} has conflicts — resolve manually

          git fetch upstream main
          git checkout main && git pull
          git merge upstream/main
          ./.fork/apply-overlay.sh
          git push origin main
          "
            git push -u origin "$BRANCH" --force-with-lease
            echo "conflict_branch=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chmod +x .fork/apply-overlay.sh
          ./.fork/apply-overlay.sh
          echo "overlay_status=ok" >> "$GITHUB_OUTPUT"

          if ! git diff --quiet; then
            git add -A
            git commit -m "chore(fork): re-apply branding overlay after upstream sync"
          else
            echo "Overlay made no additional file changes (already stamped)."
          fi

          git push origin main
          echo "pushed_main=true" >> "$GITHUB_OUTPUT"
          echo "Synced main to upstream/main @ ${UPSTREAM_SHA}"

      - name: Fail job when conflicts need manual work
        if: steps.merge.outputs.has_conflicts == 'true'
        run: |
          echo "::error::Upstream merge has conflicts. Branch: ${{ steps.merge.outputs.conflict_branch }}"
          echo "Resolve manually (see empty commit message on that branch), then re-run if needed."
          exit 1
